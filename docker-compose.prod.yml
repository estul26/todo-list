services:
  todo-list:
    image: ${TODO_IMAGE:?TODO_IMAGE is required}
    container_name: todo-list
    restart: unless-stopped
    ports:
      - "8081:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /app/data/todos.sqlite
      TODO_PASSWORD: ${TODO_PASSWORD:?TODO_PASSWORD is required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/auth/status').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - todo-list-data:/app/data

volumes:
  todo-list-data:
